name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs Vite+ (version from the package.json catalog), Node.js and Bun from devEngines,
      # then runs `vp install` with the Bun cache.
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          cache: true
          # Socket Firewall Free blocks known-malicious packages during `vp install`.
          sfw: true
          run-install: |
            - args: ['--frozen-lockfile']

      - name: Check .ai/ project memory
        run: vp run check:ai

      - name: Format, lint, types
        run: vp check

      # Colour literals, Tailwind palette classes and arbitrary values outside the design tokens (ADR 0012).
      - name: Design tokens
        run: vp run check:tokens

      # Story tests run in Chromium (ADR 0011, ADR 0012). Playwright is a dependency of packages/ui.
      - name: Install Chromium
        run: vp -C packages/ui exec playwright install --with-deps chromium

      # Fails when any measured file is below 100% coverage (thresholds in vite.config.ts).
      - name: Unit tests with coverage
        run: vp test --coverage

      - name: Build
        run: vp build

      - name: Build Storybook
        run: vp -C packages/ui run build-storybook

  db:
    name: Database tests (pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Supabase CLI is a dev dependency, so `vp install` provides it.
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          cache: true
          # Socket Firewall Free blocks known-malicious packages during `vp install`.
          sfw: true
          run-install: |
            - args: ['--frozen-lockfile']

      # Only Postgres is needed for pgTAP.
      - name: Start local database
        run: vp exec supabase db start

      # Redundant on a fresh CI database, but keeps CI identical to the local validation gate
      # (.ai/agentic.config.json), where `db start` is a no-op on an already running database.
      - name: Reset local database
        run: vp exec supabase db reset

      - name: pgTAP tests
        run: vp exec supabase test db

      # Supabase security and performance advisors (missing RLS, unindexed FKs, unsafe functions…).
      - name: Database advisors
        run: vp exec supabase db advisors --local --type all --fail-on warn
